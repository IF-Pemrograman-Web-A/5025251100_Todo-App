<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - MyTodo</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <link rel="icon" href="assets/icons/yuhara-icon.svg">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="a11y-announcer" class="sr-only" role="status" aria-live="polite"></div>

    <header class="app-header" role="banner">
        <div class="header-content">
            <div class="header-text">
                <h1>MyTodo</h1>
                <p id="auth-subtitle">Masuk atau buat akun untuk mulai.</p>
            </div>
        </div>
    </header>

    <main class="auth-card">
        <div class="auth-tabs" role="group" aria-label="Pilih masuk atau daftar">
            <button type="button" id="tab-login" aria-pressed="true">Masuk</button>
            <button type="button" id="tab-register" aria-pressed="false">Daftar</button>
        </div>

        <p id="auth-message" class="flash" role="alert" hidden></p>

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" autocomplete="email" required aria-required="true">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" autocomplete="current-password" required aria-required="true">
            </div>
            <button type="submit">Masuk</button>
        </form>

        <form id="register-form" hidden>
            <div class="form-group">
                <label for="register-name">Nama</label>
                <input type="text" id="register-name" autocomplete="name" required aria-required="true">
            </div>
            <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" autocomplete="email" required aria-required="true">
            </div>
            <div class="form-group">
                <label for="register-password">Password (minimal 8 karakter)</label>
                <input type="password" id="register-password" autocomplete="new-password" minlength="8" required aria-required="true">
            </div>
            <button type="submit">Buat Akun</button>
        </form>
    </main>

    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/login.js" defer></script>
</body>
</html>
