<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTodo UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="header-text">
                <h1>MyTodo</h1>
                <p>Web manajemen keseharian yang cocok untuk kamu</p>
            </div>
            <button id="theme-toggle" class="btn-theme">Toggle Light/Dark</button>
        </div>
    </header>

    <div class="layout-wrapper">
        <main class="todo-list-panel">
            <section class="create-todo">
                <h2>Buat list tugas baru</h2>
                <form id="create-form" class="todo-form" action="#" method="POST">
                    <input type="text" id="new-todo-title" placeholder="Apa yang anda mau lakukan?" required>
                    <div class="todo-form-submit">
                        <button type="submit">Tambahkan</button>
                    </div>
                </form>
            </section>

            <section class="list-container">
                <h2>Tugas saat ini</h2>
                <ul id="todo-list" class="todo-list"></ul>
            </section>
        </main>

        <aside class="todo-detail-panel">
            <h2>Editor Tugas</h2>
            <form id="edit-form" class="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="task-title">Judul</label>
                    <input type="text" id="task-title" required disabled>
                </div>
                <div class="form-group">
                    <label for="task-desc">Deskripsi</label>
                    <textarea id="task-desc" rows="6" disabled></textarea>
                </div>
                <div class="form-group">
                    <label for="task-status">Status</label>
                    <select id="task-status" disabled>
                        <option>In Progress</option>
                        <option>Pending</option>
                        <option>Completed</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" id="delete-task-btn" class="btn-secondary" disabled>Hapus Tugas</button>
                    <button type="submit" id="save-task-btn" class="btn-primary" disabled>Simpan Perubahan</button>
                </div>
            </form>
        </aside>
    </div>

    <footer class="app-footer">
        <p>&copy; 2026 Copyright YuHaRa. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
