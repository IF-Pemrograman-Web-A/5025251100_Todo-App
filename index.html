<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MyTodo - Web Todo List yang memiliki tingkat aksesibilitas tinggi.">
    <title>MyTodo UI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="app-header" role="banner">
        <div class="header-content">
            <div class="header-text">
                <h1>MyTodo</h1>
                <p>Web manajemen keseharian yang cocok untuk kamu</p>
            </div>
            <button id="theme-toggle" class="btn-theme" aria-label="Toggle Dark Mode">Toggle Light/Dark</button>
        </div>
    </header>

    <div class="layout-wrapper">
        <main class="todo-list-panel" role="main">
            <section class="create-todo" aria-label="create-heading">
                <h2 id="create-heading">Buat list tugas baru</h2>
                <form id="create-form" class="todo-form" action="#" method="POST">
                    <div class="input-group">
                        <label for="new-todo-title" class="sr-only">Judul Tugas</label>
                        <input type="text" id="new-todo-title" placeholder="Apa yang anda mau lakukan?" required aria-required="true">
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label for="todo-image" class="a11y-label">Foto Bukti</label>
                            <input type="file" id="todo-image" accept="image/*" capture="environment" aria-label="Ambillah foto untuk tugas anda">
                        </div>
                        <div class="input-group">
                            <label for="todo-time" class="a11y-label">Jadwal Notifikasi</label>
                            <input type="datetime-local" id="todo-time" aria-label="Atur waktu notifikasi">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Tambahkan Tugas</button>
                </form>
            </section>

            <section class="list-container" aria-labelledby="list-heading">
                <h2 id="list-heading">Tugas saat ini</h2>
                <ul id="todo-list" class="todo-list" aria-live="polite" aria-atomic="false"></ul>
            </section>
        </main>

        <aside class="todo-detail-panel" role="complementary" aria-labelledby="editor-heading">
            <h2 id="editor-heading">Editor Tugas</h2>
            <form id="edit-form" class="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="task-title">Judul</label>
                    <input type="text" id="task-title" required disabled aria-required="true">
                </div>
                <div class="form-group">
                    <label for="task-desc">Deskripsi</label>
                    <textarea id="task-desc" rows="6" disabled></textarea>
                </div>
                <div class="form-group">
                    <label for="task-status">Status</label>
                    <select id="task-status" disabled>
                        <option value="In Progress">In Progress</option>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="form-group image-preview-container" id="image-preview-container" aria-hidden="true" style="display: none;">
                    <span class="a11y-label">Foto Bukti:</span>
                    <img id="task-image-preview" src="" alt="Foto Tugas">
                </div>
                <div class="form-actions">
                    <button type="button" id="delete-task-btn" class="btn-secondary" disabled aria-label="Hapus tugas ini">Hapus Tugas</button>
                    <button type="submit" id="save-task-btn" class="btn-primary" disabled aria-label="Simpan perubahan pada tugas ini">Simpan Perubahan</button>
                </div>
            </form>
        </aside>
    </div>

    <div id="a11y-announcer" class="sr-only" aria-live="assertive"></div>

    <footer class="app-footer" role="contentinfo">
        <p>&copy; 2026 Copyright YuHaRa. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
